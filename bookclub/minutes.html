<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lahiri Literary Society</title>
  <link rel="stylesheet" href="style.css?v=4">
  <script src="content.js" defer></script>
</head>
<body data-page="Meeting Minutes">
  <header>
    <h1 id="club"></h1>
    <p class="sub" id="subtitle"></p>
    <nav><a href="index.html">Home</a><a href="about.html">About Us</a><a href="schedule.html">Reading Schedule</a><a class="here" href="minutes.html">Meeting Minutes</a></nav>
  </header>

  <p>What we've done at each meeting</p>

  <div class="reel" id="reel">
    <!-- To add a new meeting: paste a copy of an <article class="minutes"> block ABOVE the last one, so the newest is the first card. -->
    <article class="minutes">
      <h3>Meeting #1 - 12 November 2026</h3>
      <figure>
        <figcaption>Handout Side 1<br>DISCUSSION</figcaption>
        <button class="zoom" type="button"><img src="assets/meeting1-side1.jpg" alt="Meeting 1 handout, side 1: discussion notes" loading="lazy"></button>
      </figure>
      <figure>
        <figcaption>Handout Side 2<br>TRACKING THEMES/MOTIFS</figcaption>
        <button class="zoom" type="button"><img src="assets/meeting1-side2.jpg" alt="Meeting 1 handout, side 2: tracking themes and motifs" loading="lazy"></button>
      </figure>
    </article>
  </div>

  <div class="reel-nav" id="reelNav" hidden>
    <button id="prev" aria-label="Previous meeting">&#8592;</button>
    <span id="counter"></span>
    <button id="next" aria-label="Next meeting">&#8594;</button>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <img id="lightboxImg" alt="">
  </div>

  <footer>&#10087;</footer>

  <script>
    // Meeting reel: one card per meeting, snapped side by side. The arrows and
    // the counter only appear once there is more than one meeting to flip through.
    (function () {
      const reel = document.getElementById('reel');
      const nav = document.getElementById('reelNav');
      const counter = document.getElementById('counter');
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      const count = () => reel.querySelectorAll('.minutes').length;
      if (count() < 2) return;
      nav.hidden = false;
      const index = () => Math.round(reel.scrollLeft / reel.clientWidth);
      const show = (i) => {
        const n = count();
        reel.scrollTo({ left: Math.max(0, Math.min(n - 1, i)) * reel.clientWidth, behavior: 'smooth' });
      };
      const update = () => {
        const i = index(), n = count();
        counter.textContent = `${i + 1} / ${n}`;
        prev.disabled = i <= 0;
        next.disabled = i >= n - 1;
      };
      prev.addEventListener('click', () => show(index() - 1));
      next.addEventListener('click', () => show(index() + 1));
      let raf = 0;
      reel.addEventListener('scroll', () => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(update);
      }, { passive: true });
      window.addEventListener('resize', update);
      update();
    })();

    // Lightbox: a handout fills the screen; click it or anywhere else to put
    // it back. The fade only runs one way in, so closing is a quick release.
    (function () {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      let hideTimer = 0;
      const open = (img) => {
        clearTimeout(hideTimer);
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.hidden = false;
        document.body.style.overflow = 'hidden';
        requestAnimationFrame(() => lightbox.classList.add('on'));
      };
      const close = () => {
        lightbox.classList.remove('on');
        document.body.style.overflow = '';
        hideTimer = setTimeout(() => {
          lightbox.hidden = true;
          lightboxImg.src = '';
        }, 200);
      };
      document.querySelectorAll('.minutes .zoom').forEach((btn) => {
        btn.addEventListener('click', () => open(btn.querySelector('img')));
      });
      lightbox.addEventListener('click', close);
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !lightbox.hidden) close();
      });
    })();
  </script>
</body>
</html>
